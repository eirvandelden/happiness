# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pragmas:
    journal_mode: wal
    synchronous: normal
    temp_store: memory
    mmap_size: 134217728
    cache_size: -20000
    wal_autocheckpoint: 10000
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
    # Solid Queue runs inside Puma: 3 Puma threads + 3 job threads, plus headroom.
    max_connections: 10
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
    # Solid Queue runs as threads inside Puma (async mode), so one pool serves all of them.
    # Worst case is 19 connections, plus 1 spare. Re-count when RAILS_MAX_THREADS, worker
    # `threads` in config/queue.yml, the recurring tasks or the solid_queue version change.
    #   Puma request threads that enqueue (RAILS_MAX_THREADS, default 3)  3
    #   Supervisor: supervise loop, heartbeat timer, maintenance timer     3
    #   Dispatcher: poll loop, heartbeat timer, maintenance timer          3
    #   Worker: poll loop, heartbeat timer, 3 job threads                  5
    #   Scheduler: run loop, heartbeat timer, 3 recurring task timers      5
    max_connections: 20
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
