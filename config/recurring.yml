# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Runs every 15 minutes because reminder windows (09:30-12:30, 14:30-17:30,
  # 19:30-22:30) are evaluated in each USER's own timezone, not the server's —
  # fixed UTC firing times can only ever land inside one implicit timezone's
  # windows, silently skipping everyone else. ReminderJob dedupes per user via
  # User#reminded_within?/#recorded_within? so frequent runs don't repeat-send.
  mood_reminders:
    class: ReminderJob
    schedule: every 15 minutes
  appkit_session_expiry:
    class: Appkit::SessionExpiryJob
    schedule: every day at midnight
