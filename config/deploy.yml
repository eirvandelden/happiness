# Name of your application. Used to uniquely configure containers.
service: happiness

# Name of the container image.
image: happiness

# Deploy to these servers.
servers:
  web:
    - 192.168.1.101

proxy:
  ssl: false
  hosts:
    - happiness.vandelden.family
  forward_headers: true
  app_port: 3000
  healthcheck:
    path: /up
    interval: 2
    timeout: 2

# Where you keep your container images.
registry:
  server: registry.vandelden.family
  username: root
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  remote: ssh://root@192.168.1.102
  local: false
  context: "."
  args:
    RUBY_VERSION: <%= File.read('.ruby-version').strip %>

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    APP_NAME: Happiness
    REGISTRY_HTTP_ADDR: registry.vandelden.family
    SOLID_QUEUE_IN_PUMA: true
  secret:
    - RAILS_MASTER_KEY

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage for SQLite databases and Active Storage files.
volumes:
  - "/home/app_storage/happiness/storage:/rails/storage"

# Bridge fingerprinted assets between versions.
asset_path: /rails/public/assets

deploy_timeout: 20
